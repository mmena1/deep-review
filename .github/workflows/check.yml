name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check adapters and distribution
        shell: bash
        run: ./scripts/check.sh
